<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
}

.container{
width:380px;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:#1e293b;
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border-radius:8px;
border:none;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#22c55e;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.secondary{
background:#3b82f6;
margin-top:8px;
}

canvas{
background:white;
border-radius:10px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modalContent{
background:#1e293b;
padding:20px;
width:90%;
max-width:420px;
max-height:80vh;
overflow:auto;
border-radius:12px;
}

.entry{
background:#334155;
padding:12px;
margin-bottom:10px;
border-radius:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.deleteBtn{
background:#ef4444;
padding:6px 10px;
border-radius:6px;
font-size:12px;
}

.date{
font-size:12px;
color:#cbd5f5;
}

</style>
</head>

<body>

<div class="container">

<h1>Gym Tracker</h1>

<div class="card">

<label>Übung</label>
<input id="exerciseInput" list="exerciseList">
<datalist id="exerciseList"></datalist>

<label>Gewicht (kg)</label>
<input type="number" id="weightInput">

<label>Wiederholungen</label>
<input type="number" id="repsInput">

<button onclick="saveEntry()">Speichern</button>

<button class="secondary" onclick="openExerciseManager()">Übungen verwalten</button>

<button class="secondary" onclick="openHistory()">Historie verwalten</button>

</div>

<div class="card">

<label>Übung für Fortschritt wählen</label>

<select id="exerciseSelect"></select>

<button onclick="showProgress()">Fortschritt anzeigen</button>

<br><br>

<canvas id="chart"></canvas>

</div>

</div>

<!-- HISTORY MODAL -->

<div class="modal" id="historyModal">

<div class="modalContent">

<h2>Trainings Historie</h2>

<div id="historyList"></div>

<button onclick="closeHistory()">Schließen</button>

</div>

</div>

<!-- EXERCISE MANAGER -->

<div class="modal" id="exerciseModal">

<div class="modalContent">

<h2>Gespeicherte Übungen</h2>

<div id="exerciseManagerList"></div>

<button onclick="closeExerciseManager()">Schließen</button>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("gymData")) || []

let chart

function saveLocal(){
localStorage.setItem("gymData",JSON.stringify(data))
}

function saveEntry(){

let exercise=document.getElementById("exerciseInput").value.trim()
let weight=parseFloat(document.getElementById("weightInput").value)
let reps=parseInt(document.getElementById("repsInput").value)

if(!exercise||!weight||!reps)return

let date=new Date()

let oneRM=(weight*(1+reps/30)).toFixed(1)

data.push({
exercise,
weight,
reps,
oneRM,
date
})

saveLocal()

updateExerciseLists()

document.getElementById("exerciseInput").value=""
document.getElementById("weightInput").value=""
document.getElementById("repsInput").value=""

}

function updateExerciseLists(){

let exercises=[...new Set(data.map(e=>e.exercise))]

let datalist=document.getElementById("exerciseList")
let select=document.getElementById("exerciseSelect")

datalist.innerHTML=""
select.innerHTML=""

exercises.forEach(ex=>{

let option=document.createElement("option")
option.value=ex
datalist.appendChild(option)

let option2=document.createElement("option")
option2.value=ex
option2.textContent=ex
select.appendChild(option2)

})

}

function showProgress(){

let exercise=document.getElementById("exerciseSelect").value

let filtered=data.filter(e=>e.exercise===exercise)

let labels=filtered.map(e=>new Date(e.date).toLocaleDateString())

let weights=filtered.map(e=>e.weight)

let oneRM=filtered.map(e=>e.oneRM)

if(chart)chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:labels,
datasets:[
{
label:"Gewicht",
data:weights,
borderWidth:3
},
{
label:"1RM",
data:oneRM,
borderWidth:3
}
]
},

options:{
responsive:true
}

})

}

function openHistory(){

let list=document.getElementById("historyList")

list.innerHTML=""

data.forEach((e,i)=>{

let div=document.createElement("div")
div.className="entry"

div.innerHTML=`

<div>

<strong>${e.exercise}</strong><br>

${e.weight}kg • ${e.reps} reps • 1RM ${e.oneRM}

<div class="date">${new Date(e.date).toLocaleDateString()}</div>

</div>

<button class="deleteBtn" onclick="deleteEntry(${i})">X</button>

`

list.appendChild(div)

})

document.getElementById("historyModal").style.display="flex"

}

function closeHistory(){
document.getElementById("historyModal").style.display="none"
}

function deleteEntry(i){

data.splice(i,1)

saveLocal()

openHistory()

updateExerciseLists()

}

function openExerciseManager(){

let list=document.getElementById("exerciseManagerList")

let exercises=[...new Set(data.map(e=>e.exercise))]

list.innerHTML=""

exercises.forEach(ex=>{

let div=document.createElement("div")

div.className="entry"

div.innerHTML=`

<div>${ex}</div>

<button class="deleteBtn" onclick="deleteExercise('${ex}')">X</button>

`

list.appendChild(div)

})

document.getElementById("exerciseModal").style.display="flex"

}

function closeExerciseManager(){
document.getElementById("exerciseModal").style.display="none"
}

function deleteExercise(name){

data=data.filter(e=>e.exercise!==name)

saveLocal()

updateExerciseLists()

openExerciseManager()

}

updateExerciseLists()

</script>

</body>
</html>
